name: BZaudio site quality checks

on:
  push:
    branches:
      - feat/bzaudio-company-site
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Static site verification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check soundmatch.js
          node --check systemos.js
          node --check systemos-core.js
          node --check site-config.js
          node --check scripts/verify-site.mjs
          node --check scripts/accessibility-smoke.mjs
          node --check scripts/performance-smoke.mjs
          node --check scripts/verify-ecosystem.mjs
          node --check apps/systemos/app.js
          node --check adapters/allen-heath/avantis-csv.js
          node --check scripts/avantis-csv-smoke.mjs
          node --check apps/system-builder/app.js
          node --check apps/compatibility-center/app.js
          node --check apps/show-workspace/app.js
          node --check scripts/ecosystem-app-smoke.mjs
          node --check scripts/systemos-app-smoke.mjs
      - name: Verify site structure and requirements
        run: node scripts/verify-site.mjs
      - name: Test universal SystemOS core
        run: node scripts/systemos-core-smoke.mjs
      - name: Test SystemOS browser app scaffold
        run: node scripts/systemos-app-smoke.mjs
      - name: Test Avantis CSV adapter
        run: node scripts/avantis-csv-smoke.mjs
      - name: Test other BZaudio application foundations
        run: node scripts/ecosystem-app-smoke.mjs
      - name: Verify connected app ecosystem scaffold
        run: node scripts/verify-ecosystem.mjs
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node scripts/browser-smoke.mjs
      - name: Run WCAG accessibility audit
        run: node scripts/accessibility-smoke.mjs
      - name: Run performance and CDN checks
        run: node scripts/performance-smoke.mjs
      - name: Upload responsive visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bzaudio-visual-review
          path: artifacts/visual-review/*.png
          if-no-files-found: warn
